workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

default:
  interruptible: true

stages:
  - verify
  - browser
  - release

.node_job:
  image: node:22.23.3-bookworm-slim
  cache:
    key:
      files: [pnpm-lock.yaml]
      prefix: node-22.23.3-pnpm-11.28.5-v2
    paths: [.pnpm-store/]
    policy: pull
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.28.5 --activate
    - test "$(node --version)" = "v22.23.3"
    - test "$(pnpm --version)" = "11.28.5"
    - sh scripts/ci/timed.sh install pnpm install --frozen-lockfile --store-dir .pnpm-store
  artifacts:
    when: always
    expire_in: 7 days
    paths: [ci-timings.tsv]

quality:
  extends: .node_job
  stage: verify
  script:
    - sh scripts/ci/timed.sh format pnpm format:check
    - sh scripts/ci/timed.sh lint pnpm lint
    - sh scripts/ci/timed.sh types pnpm check
    - sh scripts/ci/timed.sh unit pnpm test
    - sh scripts/ci/timed.sh audit pnpm audit --audit-level=moderate

build:
  extends: .node_job
  stage: verify
  cache:
    policy: pull-push
  script:
    - sh scripts/ci/timed.sh build pnpm build
  artifacts:
    when: on_success
    expire_in: 7 days
    paths: [build/, ci-timings.tsv]

browser:
  extends: .node_job
  stage: browser
  # Immutable toolchain from Dockerfile.ci; update alongside Node/pnpm/Playwright pins.
  image: registry.gitlab.com/wispd/immichpager/ci@sha256:fd34c8ba7ca45ba0c0af981f201121def874ef32e1a77c8514ad0b1aa0dacd7f
  parallel: 2
  needs:
    - job: build
      artifacts: true
  script:
    - test "$(node -p "require('@playwright/test/package.json').version")" = "1.56.0"
    - sh scripts/ci/timed.sh browser pnpm exec playwright test --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL --reporter=line,junit
  variables:
    PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/junit.xml
  artifacts:
    when: always
    expire_in: 7 days
    paths: [test-results/, ci-timings.tsv]
    reports:
      junit: test-results/junit.xml

docker_smoke:
  stage: verify
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: '2376'
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: '$DOCKER_TLS_CERTDIR/client'
  before_script:
    - apk add --no-cache curl
    - docker info
  script:
    - sh scripts/ci/timed.sh docker-build docker build --tag immichpager:test .
    - >-
      docker run --detach --name pager --publish 3102:3000
      --env IMMICH_URL=http://127.0.0.1:2283
      --env ORIGIN=http://docker:3102 immichpager:test
    - |
      for attempt in $(seq 1 30); do
        if curl --fail --silent http://docker:3102/page/health; then exit 0; fi
        sleep 1
      done
      docker logs pager
      exit 1
  artifacts:
    when: always
    paths: [ci-timings.tsv]
    expire_in: 7 days
  after_script:
    - docker rm --force pager || true

publish_image:
  interruptible: false
  stage: release
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: '2376'
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: '$DOCKER_TLS_CERTDIR/client'
  needs:
    - quality
    - build
    - browser
    - docker_smoke
  resource_group: container-registry-release
  before_script:
    - docker info
    - >-
      printf '%s' "$CI_REGISTRY_PASSWORD" |
      docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3 --install arm64
    - docker buildx create --use --driver docker-container --name immichpager-builder
    - docker buildx inspect --bootstrap
  script:
    - |
      version="${CI_COMMIT_TAG#v}"
      minor_tag="$(printf '%s\n' "$version" | awk -F. '{print $1 "." $2}')"
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag "$CI_REGISTRY_IMAGE:$version" \
        --tag "$CI_REGISTRY_IMAGE:$minor_tag" \
        --tag "$CI_REGISTRY_IMAGE:latest" \
        --build-arg "VERSION=$version" \
        --build-arg "REVISION=$CI_COMMIT_SHA" \
        --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE:buildcache" \
        --cache-to "type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max" \
        --push .
  after_script:
    - docker buildx rm immichpager-builder || true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
    - when: never

# Rebuild only when toolchain pins change; consume the resulting digest below.
ci_tools:
  interruptible: false
  stage: verify
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: '2376'
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: '$DOCKER_TLS_CERTDIR/client'
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build -f Dockerfile.ci -t "$CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA"
    - docker inspect --format '{{index .RepoDigests 0}}' "$CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA" > ci-image.txt
  artifacts:
    paths: [ci-image.txt]
  rules:
    - changes: [Dockerfile.ci]
      when: manual
      allow_failure: true
