name: CI
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_call:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@11.28.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && pnpm lint && pnpm check && pnpm test
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --tag immichpager:test .
      - run: |
          docker run --detach --name pager --publish 127.0.0.1:3102:3000 \
            --env IMMICH_URL=http://127.0.0.1:2283 --env ORIGIN=http://127.0.0.1:3102 \
            immichpager:test
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3102/page/health; then exit 0; fi
            sleep 1
          done
          docker logs pager
          exit 1
  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [checks, docker]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
